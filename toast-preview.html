<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Превью системы уведомлений - BNC</title>
    <link rel="icon" href="assets/images/icon/icon1.png" type="image/png">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/toast.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            box-sizing: border-box;
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-family, 'Inter', sans-serif);
            transition: background 0.3s ease, color 0.3s ease;
        }

        .preview-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 24px;
            padding: 2.5rem;
            max-width: 680px;
            width: 100%;
            box-shadow: var(--card-shadow);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            text-align: center;
        }

        .preview-badge {
            display: inline-block;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--accent-gold);
            margin-bottom: 0.75rem;
        }

        .preview-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.2rem;
            margin: 0 0 1rem;
            color: var(--text-primary);
        }

        .preview-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        .btn-test {
            padding: 12px 18px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-test:active {
            transform: scale(0.97);
        }

        .btn-success {
            background: rgba(64, 192, 128, 0.15);
            color: var(--accent-green);
            border-color: rgba(64, 192, 128, 0.3);
        }
        .btn-success:hover {
            background: var(--accent-green);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(64, 192, 128, 0.3);
        }

        .btn-error {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border-color: rgba(239, 68, 68, 0.3);
        }
        .btn-error:hover {
            background: #ef4444;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.3);
        }

        .btn-warning {
            background: rgba(197, 163, 91, 0.15);
            color: var(--accent-gold);
            border-color: rgba(197, 163, 91, 0.3);
        }
        .btn-warning:hover {
            background: var(--accent-gold);
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(197, 163, 91, 0.3);
        }

        .btn-info {
            background: rgba(2, 132, 199, 0.15);
            color: #0284c7;
            border-color: rgba(2, 132, 199, 0.3);
        }
        body.dark-theme .btn-info {
            color: #38bdf8;
        }
        .btn-info:hover {
            background: #0284c7;
            color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.3);
        }

        .extra-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-subtle);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-primary);
            padding: 10px 18px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-secondary:hover {
            background: var(--border-subtle);
            transform: translateY(-1px);
        }

        .home-link {
            display: inline-block;
            margin-top: 2rem;
            color: var(--accent-gold);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s;
        }
        .home-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="preview-card">
        <div class="preview-badge">Quiet Luxury UI</div>
        <h1 class="preview-title">Новые уведомления BNC</h1>
        <p class="preview-desc">
            Современные уведомления с адаптацией под цветовую палитру сайта (Silk Green, Quiet Gold, Rose Red, Cyan Blue), эффектом матового стекла, плавными микро-анимациями и поддержкой светлой и тёмной тем.
        </p>

        <div class="preview-grid">
            <button class="btn-test btn-success" onclick="testSuccess()">
                ✓ Успех
            </button>
            <button class="btn-test btn-error" onclick="testError()">
                ✕ Ошибка
            </button>
            <button class="btn-test btn-warning" onclick="testWarning()">
                ⚠ Внимание
            </button>
            <button class="btn-test btn-info" onclick="testInfo()">
                ℹ Инфо
            </button>
        </div>

        <div class="extra-actions">
            <button class="btn-secondary" onclick="testWithActions()">
                С кнопкой действия
            </button>
            <button class="btn-secondary" onclick="toggleTheme()">
                🌓 Переключить тему
            </button>
            <button class="btn-secondary" onclick="window.showToast.clear()">
                Очистить все
            </button>
        </div>

        <div>
            <a href="index.html" class="home-link">← Вернуться на главную страницу</a>
        </div>
    </div>

    <!-- Контейнер для уведомлений -->
    <div id="toast-container" class="toast-container"></div>

    <script src="assets/js/ui.js"></script>
    <script>
        function testSuccess() {
            window.showToast('Путь к файлу успешно скопирован в буфер обмена!', 'success', {
                title: 'Скопировано'
            });
        }

        function testError() {
            window.showToast('Не удалось подключиться к серверу. Пожалуйста, проверьте соединение.', 'error', {
                title: 'Ошибка соединения'
            });
        }

        function testWarning() {
            window.showToast('Файл превышает 2 МБ. Рекомендуется оптимизировать размер перед загрузкой.', 'warning', {
                title: 'Предупреждение'
            });
        }

        function testInfo() {
            window.showToast('Доступна новая версия модификации BNC 2.0. Ознакомьтесь в каталоге.', 'info', {
                title: 'Обновление'
            });
        }

        function testWithActions() {
            window.showToast('Запись была удалена из каталога', 'warning', {
                title: 'Удаление',
                actions: [
                    {
                        label: 'Отменить',
                        onClick: () => window.showToast('Действие успешно отменено!', 'success')
                    }
                ]
            });
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            const isDark = document.body.classList.contains('dark-theme');
            window.showToast(isDark ? 'Включена тёмная тема' : 'Включена светлая тема', 'info');
        }

        // Автопоказ приветственного тоста при открытии страницы
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.showToast('Новая система уведомлений готова к работе!', 'success', {
                    title: 'Дизайн обновлен'
                });
            }, 400);
        });
    </script>
</body>
</html>
